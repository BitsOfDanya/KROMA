services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NASA_FIRMS_API_KEY: ${NASA_FIRMS_API_KEY:-}
      KROMA_DATA_SOURCE: ${KROMA_DATA_SOURCE:-demo}
      KROMA_CORS_ORIGINS: ${KROMA_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      KROMA_LIVE_SOURCES: ${KROMA_LIVE_SOURCES:-VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT}
      KROMA_LIVE_AREA: ${KROMA_LIVE_AREA:-world}
      KROMA_LIVE_DAY_RANGE: ${KROMA_LIVE_DAY_RANGE:-2}
      KROMA_LIVE_REFRESH_SECONDS: ${KROMA_LIVE_REFRESH_SECONDS:-600}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
