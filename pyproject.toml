[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/app/demo/catalog.py" = ["E501"]
"tests/backend/test_live.py" = ["E501"]
"research/experiments/af_final_model.py" = ["E501"]
"research/experiments/af_physics_baseline.py" = ["E501"]
"ml/src/kroma_ml/bs_v005_stages.py" = ["E501"]
"scripts/mount_artifacts.py" = ["E402"]
"scripts/build_train_prepared_dataset.py" = ["E402"]
