[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kroma-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.3,<2",
    "kroma-geo",
    "lightgbm>=4.6,<5",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3.1",
    "scikit-learn>=1.4,<2",
    "scipy>=1.13,<2",
    "tifffile>=2024.1,<2026",
    "torch>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
