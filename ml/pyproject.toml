[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kroma-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.3",
    "kroma-geo",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "tifffile>=2024.1",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
