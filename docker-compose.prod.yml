name: kroma

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NASA_FIRMS_API_KEY: ${NASA_FIRMS_API_KEY:-}
      KROMA_DATA_SOURCE: ${KROMA_DATA_SOURCE:-demo}
      KROMA_CORS_ORIGINS: ${KROMA_CORS_ORIGINS:-http://localhost}
      KROMA_LIVE_SOURCES: ${KROMA_LIVE_SOURCES:-VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT}
      KROMA_LIVE_AREA: ${KROMA_LIVE_AREA:-world}
      KROMA_LIVE_DAY_RANGE: ${KROMA_LIVE_DAY_RANGE:-2}
      KROMA_LIVE_REFRESH_SECONDS: ${KROMA_LIVE_REFRESH_SECONDS:-600}
      KROMA_LIVE_CLUSTER_RADIUS_KM: ${KROMA_LIVE_CLUSTER_RADIUS_KM:-6}
      KROMA_LIVE_CLUSTER_WINDOW_HOURS: ${KROMA_LIVE_CLUSTER_WINDOW_HOURS:-48}
      KROMA_LIVE_RETENTION_HOURS: ${KROMA_LIVE_RETENTION_HOURS:-72}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
