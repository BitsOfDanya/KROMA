name: kroma

services:
  db:
    image: postgis/postgis:16-3.4
    profiles: ["persistence"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_REVISION: ${KROMA_REVISION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      NASA_FIRMS_API_KEY: ${NASA_FIRMS_API_KEY:-}
      KROMA_ML_ARTIFACTS_PATH: /workspace/ml/artifacts
      KROMA_TRAIN_ROOT: /workspace/train
      KROMA_DATA_SOURCE: ${KROMA_DATA_SOURCE:-demo}
      KROMA_CORS_ORIGINS: ${KROMA_CORS_ORIGINS:-http://localhost}
      KROMA_LIVE_SOURCES: ${KROMA_LIVE_SOURCES:-VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT}
      KROMA_LIVE_AREA: ${KROMA_LIVE_AREA:-world}
      KROMA_LIVE_DAY_RANGE: ${KROMA_LIVE_DAY_RANGE:-2}
      KROMA_LIVE_REFRESH_SECONDS: ${KROMA_LIVE_REFRESH_SECONDS:-600}
      KROMA_LIVE_CLUSTER_RADIUS_KM: ${KROMA_LIVE_CLUSTER_RADIUS_KM:-6}
      KROMA_LIVE_CLUSTER_WINDOW_HOURS: ${KROMA_LIVE_CLUSTER_WINDOW_HOURS:-48}
      KROMA_LIVE_RETENTION_HOURS: ${KROMA_LIVE_RETENTION_HOURS:-72}
      KROMA_PREPARED_DATA_PATH: ${KROMA_PREPARED_DATA_PATH:-/workspace/backend/app/prepared_data}
      KROMA_ANALYSIS_MAX_DAYS: ${KROMA_ANALYSIS_MAX_DAYS:-366}
      KROMA_ANALYSIS_MAX_AREA_HA: ${KROMA_ANALYSIS_MAX_AREA_HA:-5000000}
      KROMA_ANALYSIS_MAX_FEATURES: ${KROMA_ANALYSIS_MAX_FEATURES:-50000}
    volumes:
      - ${KROMA_TRAIN_HOST_PATH:-./data/Мониторинг DATA/train}:/workspace/train:ro
      - ${KROMA_ML_ARTIFACTS_HOST_PATH:-./ml/artifacts}:/workspace/ml/artifacts:ro
      - ${KROMA_PREPARED_DATA_HOST_PATH:-./backend/app/prepared_data}:${KROMA_PREPARED_DATA_PATH:-/workspace/backend/app/prepared_data}:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_REVISION: ${KROMA_REVISION:-dev}
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
